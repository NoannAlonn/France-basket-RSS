name: Mettre à jour le flux RSS des Bleus

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Générer le flux à partir de Team France Basket
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sourceUrl = 'https://www.teamfrancebasket.com/';
          const output = 'resultats-bleus-rss.xml';

          const decode = value => value
            .replace(/&#0?39;|&apos;/gi, "'")
            .replace(/&quot;/gi, '"')
            .replace(/&amp;/gi, '&')
            .replace(/&lt;/gi, '<')
            .replace(/&gt;/gi, '>')
            .replace(/&nbsp;/gi, ' ');

          const clean = value => decode(value.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim());
          const escapeXml = value => String(value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&apos;');

          const html = await (await fetch(sourceUrl, {
            headers: { 'User-Agent': 'FranceBasketRSS/1.0', 'Accept': 'text/html' }
          })).text();

          const cards = html.match(/<article class="tile__schedule__item"[\s\S]*?<\/article>/gi) || [];
          const results = cards.flatMap(card => {
            const dateMatch = card.match(/<div class="item-match-date">([\s\S]*?)<\/div>/i);
            const teams = [...card.matchAll(/<span class="item-match-team">([\s\S]*?)<\/span>/gi)];
            const score = card.match(/href="\/game\/(\d+)"[\s\S]*?class="item-match-score[^\"]*"[^>]*>([\s\S]*?)<\/a>/i);
            const competitionMatch = card.match(/<div class="item-match-competition">([\s\S]*?)<\/div>/i);
            const scoreParts = clean(score?.[2] || '').match(/^(\d+)\s*-\s*(\d+)$/);
            const dateParts = clean(dateMatch?.[1] || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (!score || !scoreParts || !dateParts || teams.length < 2) return [];
            const date = new Date(Date.UTC(+dateParts[3], +dateParts[2] - 1, +dateParts[1], 12));
            return [{
              id: score[1], date,
              home: clean(teams[0][1]), away: clean(teams[1][1]),
              homeScore: scoreParts[1], awayScore: scoreParts[2],
              competition: clean(competitionMatch?.[1] || ''),
            }];
          }).sort((a, b) => b.date - a.date);

          if (!results.length) throw new Error('Aucun résultat final trouvé dans la source.');

          const items = results.slice(0, 30).map(match => {
            const score = `${match.home} ${match.homeScore}–${match.awayScore} ${match.away}`;
            const competition = match.competition ? ` — ${match.competition}` : '';
            return `\n    <item>\n      <title>${escapeXml(`Résultat final — ${score}`)}</title>\n      <link>https://www.teamfrancebasket.com/game/${match.id}</link>\n      <guid isPermaLink="false">france-basket-senior-${match.id}</guid>\n      <pubDate>${match.date.toUTCString()}</pubDate>\n      <description>${escapeXml(`Résultat final : ${score}${competition}. Source : Team France Basket.`)}</description>\n      <source url="https://www.teamfrancebasket.com/">Team France Basket</source>\n    </item>`;
          }).join('\n');

          const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<rss version="2.0">\n  <channel>\n    <title>Équipe de France Basket senior — Résultats finaux</title>\n    <link>https://raw.githubusercontent.com/NoannAlonn/France-basket-RSS/main/resultats-bleus-rss.xml</link>\n    <description>Les résultats finaux des matchs de l’équipe de France masculine senior de basket.</description>\n    <language>fr</language>\n    <lastBuildDate>${new Date().toUTCString()}</lastBuildDate>\n    <generator>France Basket RSS sur GitHub</generator>${items}\n  </channel>\n</rss>\n`;
          fs.writeFileSync(output, xml, 'utf8');
          console.log(`${results.length} résultats finaux écrits dans ${output}`);
          NODE

      - name: Enregistrer un nouveau résultat s’il existe
        run: |
          if git diff --quiet -- resultats-bleus-rss.xml; then
            echo "Aucun nouveau résultat final."
            exit 0
          fi
          git config user.name "France Basket RSS"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultats-bleus-rss.xml
          git commit -m "Mise à jour des résultats des Bleus"
          git push
